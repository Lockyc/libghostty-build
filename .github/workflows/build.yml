name: Build GhosttyKit

# Builds GhosttyKit.xcframework (Ghostty's macOS embedding framework) from the
# commit pinned in GHOSTTY_REF, and publishes it as a release asset that warden
# vendors. Manual for now — bumping GHOSTTY_REF and re-running is the release.
on:
  workflow_dispatch:
    inputs:
      ghostty_ref:
        description: "Override Ghostty ref (tag/branch/SHA). Empty = use GHOSTTY_REF file."
        required: false
        type: string
        default: ""
      vt_only:
        description: "Build and upload only libghostty-vt-macos.zip onto the EXISTING release for the ref; its other assets are not rebuilt or touched."
        required: false
        type: boolean
        default: false

permissions:
  contents: write        # create the release
  id-token: write        # build provenance attestation
  attestations: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15    # the SDK this build is verified on
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Resolve Ghostty ref
        id: r
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_REF: ${{ github.event.inputs.ghostty_ref }}
        run: |
          REF="${INPUT_REF:-$(tr -d '[:space:]' < GHOSTTY_REF)}"
          [ -n "$REF" ] || { echo "[!] no ref (empty input and GHOSTTY_REF)"; exit 1; }
          SHA=$(gh api "repos/ghostty-org/ghostty/commits/$REF" --jq '.sha')
          [ -n "$SHA" ] || { echo "[!] could not resolve $REF to a commit"; exit 1; }
          echo "ref=$REF"         >> "$GITHUB_OUTPUT"
          echo "sha=$SHA"         >> "$GITHUB_OUTPUT"
          echo "short=${SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "[*] $REF -> $SHA"

      - name: Clone Ghostty @ pinned sha
        env:
          SHA: ${{ steps.r.outputs.sha }}
        run: |
          git clone --filter=blob:none https://github.com/ghostty-org/ghostty ghostty-src
          git -C ghostty-src checkout --detach "$SHA"

      # The Zig this SHA builds with is upstream's own declaration, so any ref — the
      # pinned one or an override — gets the Zig it needs.
      - name: Read Ghostty's minimum Zig version
        id: z
        run: |
          V=$(sed -nE 's/.*\.minimum_zig_version *= *"([^"]+)".*/\1/p' ghostty-src/build.zig.zon)
          [ -n "$V" ] || { echo "[!] no minimum_zig_version in build.zig.zon"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "[*] Zig $V"

      # Pinned by commit: a retargeted tag would run with release-write and attestation rights.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ steps.z.outputs.version }}

      - name: Build GhosttyKit.xcframework (universal)
        if: ${{ !inputs.vt_only }}
        run: ./scripts/build-xcframework.sh "$PWD/ghostty-src" "$PWD/dist"

      - name: Build libghostty-vt (universal)
        run: ./scripts/build-vt.sh "$PWD/ghostty-src" "$PWD/dist"

      # Rooted at lib/ + include/, so a consumer unpacks it straight into its vendor dir.
      - name: Package + checksum libghostty-vt
        run: |
          set -euo pipefail
          cd dist/libghostty-vt
          ditto -c -k --sequesterRsrc . ../libghostty-vt-macos.zip
          cd ..
          shasum -a 256 libghostty-vt-macos.zip | tee libghostty-vt-macos.zip.sha256

      - name: Package + checksum
        if: ${{ !inputs.vt_only }}
        run: |
          set -euo pipefail
          cd dist
          ditto -c -k --sequesterRsrc --keepParent GhosttyKit.xcframework GhosttyKit.xcframework.zip
          shasum -a 256 GhosttyKit.xcframework.zip | tee GhosttyKit.xcframework.zip.sha256
          # Resources zip holds terminfo/ + ghostty/ at its ROOT (no --keepParent), so a
          # consumer unpacks it straight into an app bundle's Contents/Resources.
          ditto -c -k --sequesterRsrc GhosttyResources GhosttyResources.zip
          shasum -a 256 GhosttyResources.zip | tee GhosttyResources.zip.sha256

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/libghostty-vt-macos.zip
            ${{ !inputs.vt_only && 'dist/GhosttyKit.xcframework.zip' || '' }}
            ${{ !inputs.vt_only && 'dist/GhosttyResources.zip' || '' }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Passed through env, never ${{ }}-expanded into the script: the ref is free text from the
          # dispatch input, and expanded it would run as shell.
          REF: ${{ steps.r.outputs.ref }}
          SHA: ${{ steps.r.outputs.sha }}
          SHORT: ${{ steps.r.outputs.short }}
          ZIG_VERSION: ${{ steps.z.outputs.version }}
          IS_OVERRIDE: ${{ github.event.inputs.ghostty_ref != '' }}
          VT_ONLY: ${{ inputs.vt_only }}
        run: |
          TAG="ghostty-$SHORT"
          # warden vendors the latest release: a pinned build becomes latest (including a rollback
          # to a pin whose release already exists); an override test build is a prerelease, never latest.
          if [ "$IS_OVERRIDE" = true ]; then CHANNEL=--prerelease; else CHANNEL=--latest; fi
          # No apostrophes in NOTES: the heredoc sits inside $( ), where bash still parses the body
          # for quotes, so a lone ' fails the whole step with "unexpected EOF while looking for `''".
          NOTES=$(cat <<EOF
          Three assets, all built from **unmodified** upstream Ghostty (the first two via its own
          \`-Demit-xcframework\` build graph):

          - **\`GhosttyKit.xcframework.zip\`** — universal macOS (arm64 + x86_64) static libghostty.
          - **\`GhosttyResources.zip\`** — the runtime resources (\`terminfo/\` + \`ghostty/shell-integration/\`),
            unpacked straight into the \`Contents/Resources\` of an embedding app bundle.
            **Required**: libghostty probes for \`Contents/Resources/terminfo/78/xterm-ghostty\` and
            silently falls back to \`TERM=xterm-256color\` without it, which costs synchronized
            output (DEC 2026), styled underlines, and shell integration.
          - **\`libghostty-vt-macos.zip\`** — libghostty-vt, the standalone VT library from Ghostty (\`-Demit-lib-vt\`):
            universal macOS \`lib/libghostty-vt.a\` plus \`include/ghostty/vt.h\` + \`vt/\`, rooted so it
            unpacks straight into a vendor dir.

          - ref: \`${REF}\`
          - sha: \`${SHA}\`

          Zig ${ZIG_VERSION}, \`macos-15\` runner. Consumed by [warden](https://github.com/lockyc/warden)
          via \`just revendor-ghostty\`. Verify with the attached \`.sha256\` files and the GitHub
          build provenance attestation.
          EOF
          )
          cd dist
          VT_ASSETS="libghostty-vt-macos.zip libghostty-vt-macos.zip.sha256"
          if [ "$VT_ONLY" = true ]; then
            # Adds to the release the ref already has; the existing assets are never rebuilt or replaced.
            gh release view "$TAG" >/dev/null
            gh release upload "$TAG" $VT_ASSETS --clobber
            gh release edit "$TAG" --notes "$NOTES"
            exit 0
          fi
          ASSETS="GhosttyKit.xcframework.zip GhosttyKit.xcframework.zip.sha256 GhosttyResources.zip GhosttyResources.zip.sha256 $VT_ASSETS"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "$NOTES" \
            "$CHANNEL" \
            $ASSETS \
            || { gh release upload "$TAG" $ASSETS --clobber; gh release edit "$TAG" --notes "$NOTES" "$CHANNEL"; }
